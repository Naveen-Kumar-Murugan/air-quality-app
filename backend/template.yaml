AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        SCANS_TABLE: !Ref ScansTable
        GEOCELLS_TABLE: !Ref GeoCellsTable
        STATIONS_TABLE: !Ref StationsTable
        RATELIMITS_TABLE: !Ref RateLimitsTable
        SCANS_BUCKET: !Ref ScansBucket

Parameters:
  SageMakerEndpointName:
    Type: String
    Default: aq-sky-classifier
    Description: SageMaker endpoint invoked when ScanFunction MODEL_MODE is set to sagemaker.

  MapboxToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Mapbox Directions API access token. Leave blank to rely on the MAPBOX_TOKEN environment variable or local .env file.

Resources:
  GeoCellsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [aqi, category, confidence, source]
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  StationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ScansBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireScans
            Status: Enabled
            ExpirationInDays: 30

  ModelsBucket:
    Type: AWS::S3::Bucket

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AutoVerifiedAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignupFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: ["*"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/hello/
      Runtime: python3.13
      Handler: app.handler
      Layers:
        - !Ref CommonLayer
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer

  PreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/pre_signup/
      Runtime: python3.13
      Handler: app.handler
      Layers:
        - !Ref CommonLayer
      Timeout: 3
      MemorySize: 128

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/upload_url/
      Runtime: python3.13
      Handler: app.handler
      Layers:
        - !Ref CommonLayer
      Timeout: 10
      MemorySize: 256
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ScansBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitsTable
      Events:
        UploadUrlApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /scans/upload-url
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          SCANS_BUCKET: !Ref ScansBucket
          RATE_LIMITS_TABLE: !Ref RateLimitsTable

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/scan/
      Runtime: python3.13
      Handler: app.handler
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ScansBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ScansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GeoCellsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StationsTable
        - Statement:
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
              Resource: !Sub arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/${SageMakerEndpointName}
      Events:
        ScanApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /scans
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          SCANS_TABLE: !Ref ScansTable
          GEOCELLS_TABLE: !Ref GeoCellsTable
          STATIONS_TABLE: !Ref StationsTable
          SCANS_BUCKET: !Ref ScansBucket
          MODEL_MODE: sagemaker
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
          SAGEMAKER_INVOKE_TIMEOUT_SECONDS: "20"

  ScansMineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/scans_mine/
      Runtime: python3.13
      Handler: app.handler
      Layers:
        - !Ref CommonLayer
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScansTable
      Events:
        ScansMineApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /scans/mine
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          SCANS_TABLE: !Ref ScansTable

  MapFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/map/
      Runtime: python3.13
      Handler: app.handler
      Layers:
        - !Ref CommonLayer
      Timeout: 15
      MemorySize: 512
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GeoCellsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StationsTable
      Events:
        MapApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /map
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          GEOCELLS_TABLE: !Ref GeoCellsTable
          STATIONS_TABLE: !Ref StationsTable

  RouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/route/
      Runtime: python3.13
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GeoCellsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StationsTable
      Events:
        RouteApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /route
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          MAPBOX_TOKEN: !Ref MapboxToken
          GEOCELLS_TABLE: !Ref GeoCellsTable
          STATIONS_TABLE: !Ref StationsTable

  CoachFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/coach
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource:
                - arn:aws:bedrock:ap-south-1::foundation-model/amazon.nova-lite-v1:0
                - arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0
                - arn:aws:bedrock:ap-south-1:048834208130:inference-profile/apac.amazon.nova-lite-v1:0
                - "*"
            - Sid: DynamoDBRead
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource:
                - !GetAtt GeoCellsTable.Arn
                - !GetAtt StationsTable.Arn
                - !GetAtt ScansTable.Arn
                - !Sub "${GeoCellsTable.Arn}/index/*"
                - !Sub "${StationsTable.Arn}/index/*"
                - !Sub "${ScansTable.Arn}/index/*"
      Events:
        CoachApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /coach
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          BEDROCK_MODEL_ID: apac.amazon.nova-lite-v1:0
          BEDROCK_REGION: ap-south-1
          GEOCELLS_TABLE: !Ref GeoCellsTable
          STATIONS_TABLE: !Ref StationsTable
          SCANS_TABLE: !Ref ScansTable

  PreSignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreSignupFunction.Arn
      Principal: cognito-idp.amazonaws.com
      Action: lambda:InvokeFunction
      SourceArn: !GetAtt UserPool.Arn

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
  ModelsBucketName:
    Description: S3 bucket for ML model artifacts
    Value: !Ref ModelsBucket
  SageMakerEndpointName:
    Description: SageMaker endpoint name for AQI sky classifier
    Value: !Ref SageMakerEndpointName
