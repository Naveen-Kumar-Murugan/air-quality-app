name: air_quality_app
description: Air Quality estimation app using phone photos, GPS, and weather data.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  amazon_cognito_identity_dart_2: ^3.3.0
  uuid: ^4.0.0
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  sensors_plus: ^5.0.0
  flutter_image_compress: ^2.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
